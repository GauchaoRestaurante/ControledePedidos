name: Deploy Controle de Pedidos

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências de forma reproduzível e segura
        run: npm ci

      - name: Executar testes de segurança e validação
        run: npm test

      - name: Criar versão de produção para GitHub Pages
        env:
          BUILD_FOR_PAGES: true
          GITHUB_PAGES: true
        run: npm run build:pages

      - name: Verificar segurança do artefato estático
        run: |
          # Garantir remoção de quaisquer resquícios de servidor ou mapas de código
          rm -f ./dist/server.cjs ./dist/server.cjs.map ./dist/*.map ./dist/.env*
          # Validar que nenhum arquivo restrito ou de backend foi incluído no pacote público
          if [ -f ./dist/server.cjs ] || [ -f ./dist/server.cjs.map ] || [ -f ./dist/.env ]; then
            echo "ERRO DE SEGURANÇA: Arquivo confidencial ou de backend detectado no artefato estático!"
            exit 1
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
